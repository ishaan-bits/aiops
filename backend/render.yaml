services:
  - type: web
    name: aiops-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        value: https://pjocwiwsbfarikzqpkbs.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        generateValue: false
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'
      - key: OLLAMA_URL
        value: ""
